name: Tag main pushes

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: main-integration
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Create a tag for the main commit
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="auto-$(date -u +'%Y%m%d-%H%M%S')-${RUN_NUMBER}"
          git tag --annotate "$tag" --message "Automatic tag for main commit ${{ github.sha }}" "${{ github.sha }}"
          git push origin "$tag"

          echo "Created $tag at ${{ github.sha }}"
