# default: Use block indentation for wrapped calls instead of YAS-style alignment.
style = "default"
# Some constraint functions have long argument lists; increase the margin to keep signatures readable.
margin = 150
indent = 4
normalize_line_endings = "unix"
always_for_in = true
remove_extra_newlines = true
short_to_long_function_def = false
always_use_return = true
whitespace_ops_in_indices = true
whitespace_typedefs = true
# Convert long a ? b : c expressions to if/else to keep nested calls readable.
conditional_to_if = true
