name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version:
          - '1.10'
          - '1'

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2

      - uses: julia-actions/julia-buildpkg@v1

      - uses: julia-actions/julia-runtest@v1

      - name: Run fast public interface tests
        run: julia --project=. test/fast_interface.jl

      - name: Run unified algorithm smoke tests
        timeout-minutes: 20
        run: julia --project=. test/smoke_algorithms.jl

      - name: Run GUI security tests
        run: python3 -m unittest discover -s test -p 'test_gui_security.py'
