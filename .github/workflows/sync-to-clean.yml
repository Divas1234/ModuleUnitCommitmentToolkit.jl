name: Sync to Clean Repo

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to clean repo
        run: |
          git -c http.extraheader="" push --force "https://${{ secrets.SYNC_TOKEN }}@github.com/Divas1234/ModuleUnitCommitmentToolkit.jl.git" HEAD:refs/heads/main
